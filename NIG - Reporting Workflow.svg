<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2410 1320" role="img" aria-labelledby="svgtitle svgdesc"><title id="svgtitle">MEP weekly reporting — the implemented workflow</title><desc id="svgdesc">Read left to right across the top, then right to left across the bottom. Files are extracted and validated on upload. Clicking Create report draft starts generation and repeats validation and calculations; Python calculates figures and AI drafts notes; the baseline is for evaluation only. Evidence is checked, the draft is autosaved, HTML and PowerPoint are prepared for direct download and reviewed outside the app. The library reopens drafts. Failure paths and future scope are labelled.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#dedfe8"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8c8b9d"/></marker><marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#bc8540"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#292b36}.node{cursor:pointer;outline:none}.node:hover .card,.node:focus .card,.node.selected .card{stroke:#7560bf;stroke-width:3}.node.selected .card{filter:drop-shadow(0 3px 5px #82739b30)}.edge{fill:none;stroke:#8c8b9d;stroke-width:2.2;marker-end:url(#arrow)}.loop{fill:none;stroke:#bc8540;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#amberArrow)}.edge-label{font-size:18px;fill:#67667b;paint-order:stroke;stroke:#fbfbfd;stroke-width:8;stroke-linejoin:round}.small{font-size:18px;fill:#67667b}</style><rect width="2410" height="1320" fill="#fbfbfd"/><rect width="2410" height="1320" fill="url(#dots)"/><text x="60" y="52" font-size="30" font-weight="600">MEP / Weekly reporting workflow</text><text x="60" y="88" class="small">Implemented prototype · Read across the top → then back along the bottom ←</text><text x="60" y="161" font-size="18" fill="#787582" letter-spacing="2">ON UPLOAD · EXTRACT &amp; CHECK</text><text x="60" y="760" font-size="18" fill="#787582" letter-spacing="2">EXPORT &amp; USE</text><text x="1575" y="760" font-size="18" letter-spacing="2">PREPARE &amp; DOWNLOAD</text><path class="edge" d="M370 300H445"/><path class="edge" d="M755 300H830"/><text class="edge-label" x="1110" y="119">figures</text><text class="edge-label" x="1515" y="310">notes</text><path class="edge" stroke-dasharray="7 6" d="M1537 325V578 H1575"/><text class="edge-label" x="1545" y="475">or</text><path class="edge" d="M1885 140H1920V255 H1960"/><path class="edge" d="M1885 360H1960"/><path class="edge" stroke-dasharray="7 6" d="M1885 578H1930V372 H1960"/><path class="edge" d="M2280 300H2350V892 H2280"/><text class="edge-label" x="2140" y="785">draft + issues</text><path class="edge" d="M1960 892H1885"/><path class="edge" d="M1575 892H1140"/><path class="edge" d="M830 892H755"/><path class="edge" d="M445 892H370"/><path class="edge" d="M2120 980V1085"/><text class="edge-label" x="2140" y="1040">saved locally</text><path class="edge" d="M1960 1157H1850V980"/><text class="edge-label" x="1870" y="1138">reopen</text><path class="loop" d="M985 980V1040 H1640V980"/><text class="edge-label" x="1040" y="1068">open saved report</text><path class="loop" d="M985 395V460"/><text class="edge-label" x="1004" y="431">invalid input</text><path class="loop" d="M830 535H600V395"/><text class="edge-label" x="634" y="515">correct files</text><path class="loop" d="M1885 395H1905V482 H1960"/><rect x="830" y="460" width="310" height="145" rx="15" fill="#fff6e8" stroke="#e6cca9"/><text x="852" y="494" font-size="22" font-weight="600">Stop &amp; correct the input</text><text x="852" y="528" font-size="19">Invalid files block generation.</text><text x="852" y="559" font-size="19">Warnings remain visible;</text><text x="852" y="585" font-size="19">missing data is not invented.</text><rect x="1960" y="455" width="320" height="230" rx="15" fill="#fff6e8" stroke="#e6cca9"/><text x="1982" y="490" font-size="22" font-weight="600">Failure paths</text><text x="1982" y="526" font-size="19">API / output-format failure:</text><text x="1982" y="553" font-size="19">no new draft; retry explicitly.</text><text x="1982" y="600" font-size="19">Quote / source check failure:</text><text x="1982" y="627" font-size="19">draft is saved but cannot be</text><text x="1982" y="654" font-size="19">exported. Generate a new draft.</text><text x="1575" y="247" class="small">Meeting material uses AI ↓</text><path d="M515 590H555V395" fill="none" stroke="#8c8b9d" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="567" y="453" class="edge-label">future intake</text><path class="edge" d="M1140 300 H1200"/><path class="edge" d="M1510 280 H1537 V140 H1575"/><path class="edge" d="M1510 325 H1575"/><g class="node" id="generate" tabindex="0" role="button" aria-label="User trigger: Create report draft"><rect class="card" x="1200" y="220" width="310" height="180" rx="18" fill="#f3efff" stroke="#a38acf" stroke-width="2"/><text x="1220" y="252" font-size="17" style="fill:#7960c4">PERSON · START GENERATION</text><text x="1220" y="291" font-size="23" font-weight="600">Click Create report draft</text><text x="1220" y="329" font-size="18">Enabled after upload checks.</text><text x="1220" y="356" font-size="18">Revalidate, recalculate, then AI.</text><text x="1220" y="382" font-size="18">No AI call before this click.</text></g><g class="node" id="inputs" tabindex="0" role="button" aria-label="1: Choose meeting &amp; files"><rect class="card" x="60" y="205" width="310" height="190" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="77" y="222" width="43" height="30" rx="8" fill="#fff6e8"/><text x="98" y="244" text-anchor="middle" style="fill:#a66c20" font-size="19" font-weight="600">1</text><text x="352" y="242" text-anchor="end" class="small">PERSON</text><text x="80" y="283" font-size="23" font-weight="600">Choose meeting &amp; files</text><text x="80" y="316" font-size="17" style="fill:#626171">Select meeting type + report week</text><text x="80" y="343" font-size="17" style="fill:#626171">Spreadsheet, meeting material, or both</text><text x="80" y="370" font-size="17" style="fill:#626171">Upload files or paste your notes</text></g><g class="node" id="extract" tabindex="0" role="button" aria-label="2: Extract &amp; organise"><rect class="card" x="445" y="205" width="310" height="190" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="462" y="222" width="43" height="30" rx="8" fill="#eef8f5"/><text x="483" y="244" text-anchor="middle" style="fill:#287c68" font-size="19" font-weight="600">2</text><text x="737" y="242" text-anchor="end" class="small">CODE / LOCAL</text><text x="465" y="283" font-size="23" font-weight="600">Extract &amp; organise</text><text x="465" y="316" font-size="19" style="fill:#626171">Read text and spreadsheet cells</text><text x="465" y="343" font-size="19" style="fill:#626171">Keep names and timecodes</text><text x="465" y="370" font-size="19" style="fill:#626171">Create internal source records</text></g><g class="node" id="validate" tabindex="0" role="button" aria-label="3: Validate the inputs"><rect class="card" x="830" y="205" width="310" height="190" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="847" y="222" width="43" height="30" rx="8" fill="#eef8f5"/><text x="868" y="244" text-anchor="middle" style="fill:#287c68" font-size="19" font-weight="600">3</text><text x="1122" y="242" text-anchor="end" class="small">CODE / LOCAL</text><text x="850" y="283" font-size="23" font-weight="600">Validate the inputs</text><text x="850" y="316" font-size="19" style="fill:#626171">Check week, columns, units, limits</text><text x="850" y="343" font-size="19" style="fill:#626171">Block invalid inputs before drafting</text><text x="850" y="370" font-size="19" style="fill:#626171">Flag missing dates or values</text></g><g class="node" id="metrics" tabindex="0" role="button" aria-label="4a: Calculate the figures"><rect class="card" x="1575" y="65" width="310" height="150" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="1592" y="82" width="43" height="30" rx="8" fill="#eef8f5"/><text x="1613" y="104" text-anchor="middle" style="fill:#287c68" font-size="19" font-weight="600">4a</text><text x="1867" y="102" text-anchor="end" class="small">CODE / LOCAL</text><text x="1595" y="143" font-size="23" font-weight="600">Calculate the figures</text><text x="1595" y="176" font-size="19" style="fill:#626171">Compare this week with last week</text><text x="1595" y="203" font-size="19" style="fill:#626171">Use Python for every calculation</text></g><g class="node" id="ai" tabindex="0" role="button" aria-label="4b: AI-assisted drafting"><rect class="card" x="1575" y="275" width="310" height="170" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="1592" y="292" width="43" height="30" rx="8" fill="#f3efff"/><text x="1613" y="314" text-anchor="middle" style="fill:#7960c4" font-size="19" font-weight="600">4b</text><text x="1867" y="312" text-anchor="end" class="small">AI CALL</text><text x="1595" y="353" font-size="23" font-weight="600">AI-assisted drafting</text><text x="1595" y="386" font-size="19" style="fill:#626171">Draft only when notes are supplied</text><text x="1595" y="413" font-size="19" style="fill:#626171">Spreadsheet only: no AI call</text><text x="1595" y="440" font-size="19" style="fill:#626171">Findings, quotes, open questions</text></g><g class="node" id="baseline" tabindex="0" role="button" aria-label="4c: Non-AI baseline"><rect class="card" x="1575" y="505" width="310" height="145" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="1592" y="522" width="43" height="30" rx="8" fill="#eef8f5"/><text x="1613" y="544" text-anchor="middle" style="fill:#287c68" font-size="19" font-weight="600">4c</text><text x="1867" y="542" text-anchor="end" class="small">CODE / LOCAL</text><text x="1595" y="583" font-size="23" font-weight="600">Non-AI baseline</text><text x="1595" y="616" font-size="19" style="fill:#626171">Model comparison only</text><text x="1595" y="643" font-size="19" style="fill:#626171">Copy verbatim source excerpts</text></g><g class="node" id="assemble" tabindex="0" role="button" aria-label="5: Assemble &amp; check"><rect class="card" x="1960" y="205" width="320" height="190" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="1977" y="222" width="43" height="30" rx="8" fill="#eef8f5"/><text x="1998" y="244" text-anchor="middle" style="fill:#287c68" font-size="19" font-weight="600">5</text><text x="2262" y="242" text-anchor="end" class="small">CODE / LOCAL</text><text x="1980" y="283" font-size="23" font-weight="600">Assemble &amp; check</text><text x="1980" y="316" font-size="19" style="fill:#626171">Combine figures with the draft</text><text x="1980" y="343" font-size="19" style="fill:#626171">Check source IDs and exact quotes</text><text x="1980" y="370" font-size="19" style="fill:#626171">Keep warnings visible</text></g><g class="node" id="save" tabindex="0" role="button" aria-label="6: Autosave the draft"><rect class="card" x="1960" y="805" width="320" height="175" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="1977" y="822" width="43" height="30" rx="8" fill="#eef8f5"/><text x="1998" y="844" text-anchor="middle" style="fill:#287c68" font-size="19" font-weight="600">6</text><text x="2262" y="842" text-anchor="end" class="small">CODE / LOCAL</text><text x="1980" y="883" font-size="23" font-weight="600">Autosave the draft</text><text x="1980" y="916" font-size="19" style="fill:#626171">Keep a local working copy</text><text x="1980" y="943" font-size="19" style="fill:#626171">Store sources, metrics and model</text><text x="1980" y="970" font-size="19" style="fill:#626171">Reopen without another AI call</text></g><g class="node" id="review" tabindex="0" role="button" aria-label="7: Prepare written report"><rect class="card" x="1575" y="805" width="310" height="175" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="1592" y="822" width="43" height="30" rx="8" fill="#eef8f5"/><text x="1613" y="844" text-anchor="middle" style="fill:#287c68" font-size="19" font-weight="600">7</text><text x="1867" y="842" text-anchor="end" class="small">CODE / LOCAL</text><text x="1595" y="883" font-size="22" font-weight="600">Prepare written report</text><text x="1595" y="916" font-size="18" style="fill:#626171">Turn findings into a clear brief</text><text x="1595" y="943" font-size="18" style="fill:#626171">Include figures and open questions</text><text x="1595" y="970" font-size="18" style="fill:#626171">No approval form</text></g><g class="node" id="approve" tabindex="0" role="button" aria-label="8: Prepare presentation"><rect class="card" x="830" y="805" width="310" height="175" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="847" y="822" width="43" height="30" rx="8" fill="#eef8f5"/><text x="868" y="844" text-anchor="middle" style="fill:#287c68" font-size="19" font-weight="600">8</text><text x="1122" y="842" text-anchor="end" class="small">CODE / LOCAL</text><text x="850" y="883" font-size="22" font-weight="600">Prepare presentation</text><text x="850" y="916" font-size="18" style="fill:#626171">Create editable slides locally</text><text x="850" y="943" font-size="18" style="fill:#626171">Charts, findings and tables</text><text x="850" y="970" font-size="18" style="fill:#626171">No additional AI call</text></g><g class="node" id="export" tabindex="0" role="button" aria-label="9: Download your report"><rect class="card" x="445" y="805" width="310" height="175" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="462" y="822" width="43" height="30" rx="8" fill="#fff6e8"/><text x="483" y="844" text-anchor="middle" style="fill:#a66c20" font-size="19" font-weight="600">9</text><text x="737" y="842" text-anchor="end" class="small">PERSON</text><text x="465" y="883" font-size="22" font-weight="600">Download your report</text><text x="465" y="916" font-size="18" style="fill:#626171">Written report or PowerPoint</text><text x="465" y="943" font-size="18" style="fill:#626171">Read and edit the downloaded file</text><text x="465" y="970" font-size="18" style="fill:#626171">Nothing is sent automatically</text></g><g class="node" id="meeting" tabindex="0" role="button" aria-label="10: Use it in the meeting"><rect class="card" x="60" y="805" width="310" height="175" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="77" y="822" width="43" height="30" rx="8" fill="#fff6e8"/><text x="98" y="844" text-anchor="middle" style="fill:#a66c20" font-size="19" font-weight="600">10</text><text x="352" y="842" text-anchor="end" class="small">PERSON</text><text x="80" y="883" font-size="23" font-weight="600">Use it in the meeting</text><text x="80" y="916" font-size="19" style="fill:#626171">A reviewed meeting report</text><text x="80" y="943" font-size="19" style="fill:#626171">Discuss priorities and actions</text><text x="80" y="970" font-size="19" style="fill:#626171">Sharing remains a manual step</text></g><g class="node" id="library" tabindex="0" role="button" aria-label="↺: Report library"><rect class="card" x="1960" y="1085" width="320" height="145" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="1977" y="1102" width="43" height="30" rx="8" fill="#eef8f5"/><text x="1998" y="1124" text-anchor="middle" style="fill:#287c68" font-size="19" font-weight="600">↺</text><text x="2262" y="1122" text-anchor="end" class="small">CODE / LOCAL</text><text x="1980" y="1163" font-size="22" font-weight="600">Report library</text><text x="1980" y="1196" font-size="18" style="fill:#626171">Reopen saved reports</text><text x="1980" y="1223" font-size="18" style="fill:#626171">Download without another AI call</text></g><g class="node" id="tenant" tabindex="0" role="button" aria-label="F: Approved document sources"><rect class="card" x="60" y="470" width="455" height="185" rx="18" fill="white" stroke="#dbdbe5" stroke-width="1.4"/><rect x="77" y="487" width="43" height="30" rx="8" fill="#f1eff6"/><text x="98" y="509" text-anchor="middle" style="fill:#7d728f" font-size="19" font-weight="600">F</text><text x="497" y="507" text-anchor="end" class="small">FUTURE / NOT CONNECTED</text><text x="80" y="548" font-size="23" font-weight="600">Approved document sources</text><text x="80" y="581" font-size="19" style="fill:#626171">SharePoint / organisational OneDrive</text><text x="80" y="608" font-size="19" style="fill:#626171">Detect changes; prepare weekly evidence</text><text x="80" y="635" font-size="19" style="fill:#626171">Replace laptop staging and manual upload</text></g><rect x="60" y="1110" width="1080" height="120" rx="16" fill="#f2f1f6" stroke="#d8d6e2" stroke-dasharray="6 5"/><text x="84" y="1146" font-size="22" font-weight="600">Outside the automated boundary</text><text x="84" y="1180" font-size="19">Live connectors · transcription / handwriting OCR · scheduling · automatic model routing</text><text x="84" y="1209" font-size="19">Sending reports · engineering prioritisation · delivery commitments · production access controls</text><text x="60" y="1290" class="small">Mock portfolio pages are presentation previews. They do not feed this workflow. Model comparison is a separate evaluation tool.</text><path d="M715 395 V650" fill="none" stroke="#a38acf" stroke-dasharray="7 6" stroke-width="2" marker-end="url(#arrow)"/><path d="M1140 700 H1160 V370 H1140" fill="none" stroke="#a38acf" stroke-dasharray="7 6" stroke-width="2" marker-end="url(#arrow)"/><g class="node" id="assisted-intake" tabindex="0" role="button" aria-label="Future assisted intake"><rect class="card" x="550" y="650" width="590" height="100" rx="15" fill="#f3efff" stroke="#a38acf" stroke-dasharray="7 6"/><text x="571" y="683" font-size="22" font-weight="600">Future: automatic assisted intake</text><text x="571" y="716" font-size="19">After extraction, before validation. Not built.</text><text x="571" y="740" font-size="17">AI maps fields; code validates; uncertainty stays visible.</text></g></svg>