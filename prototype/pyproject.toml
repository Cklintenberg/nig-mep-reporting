[project]
name = "mep-weekly-review"
version = "0.1.0"
description = "Evidence-linked weekly reporting prototype for the fictional NIG case"
requires-python = ">=3.12,<3.14"
dependencies = [
  "streamlit>=1.45,<2",
  "pandas>=2.2,<3",
  "altair>=5,<7",
  "pydantic>=2.10,<3",
  "openai>=2,<3",
  "anthropic>=0.80,<2",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "openpyxl>=3.1,<4",
  "python-docx>=1.2,<2",
  "pypdf>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
